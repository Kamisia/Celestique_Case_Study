<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Celestique main user flow</title>
  <desc id="desc">Account, service selection, credits or subscription, report form, generation, web report and PDF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1026"/>
      <stop offset="0.54" stop-color="#17123A"/>
      <stop offset="1" stop-color="#101B3F"/>
    </linearGradient>
    <linearGradient id="card" x1="76" y1="54" x2="1168" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D8B4FE"/>
      <stop offset="0.5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="260" rx="28" fill="url(#bg)"/>
  <circle cx="116" cy="52" r="2" fill="#D8B4FE" opacity="0.9"/>
  <circle cx="1090" cy="42" r="2" fill="#93C5FD" opacity="0.9"/>
  <circle cx="1212" cy="206" r="2" fill="#C4B5FD" opacity="0.8"/>
  <circle cx="266" cy="218" r="1.8" fill="#F0ABFC" opacity="0.7"/>
  <circle cx="726" cy="34" r="1.8" fill="#BAE6FD" opacity="0.75"/>

